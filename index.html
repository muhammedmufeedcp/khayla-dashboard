*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.55 "Space Grotesk",system-ui,sans-serif;background:radial-gradient(900px 480px at 70% -80px,#0f6b47aa,transparent 70%),radial-gradient(600px 400px at 0 0,#0a3a2a88,transparent 70%),linear-gradient(rgba(61,242,168,.045) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(61,242,168,.045) 1px,transparent 1px) 0 0/48px 48px,var(--bg);background-attachment:fixed}
aside{display:none}
nav.tabs{position:fixed;left:10px;right:10px;bottom:10px;z-index:9;display:flex;background:rgba(11,20,16,.92);backdrop-filter:blur(12px);border:1px solid rgba(61,242,168,.2);border-radius:18px;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;text-align:center;font-size:11px;padding:7px 0;color:var(--muted);text-decoration:none;border-radius:14px}
nav.tabs a .nav-icon{display:flex;align-items:center;justify-content:center;margin:0 auto 3px;width:30px;height:27px;color:currentColor;transition:transform .28s cubic-bezier(.2,.8,.2,1),filter .28s}
.nav-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s,filter .3s}
nav.tabs a.on{color:#04120c;background:linear-gradient(135deg,#68ffc2,var(--ac));font-weight:700;box-shadow:0 5px 18px rgba(61,242,168,.2)}
nav.tabs a.on .nav-icon{transform:translateY(-2px) scale(1.08)}
nav.tabs a.on .nav-icon svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));animation:iconPop .45s ease both}
nav.tabs a:active .nav-icon{transform:scale(.88)}
@keyframes iconPop{0%{transform:scale(.7) rotate(-8deg)}65%{transform:scale(1.14) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media(prefers-reduced-motion:no-preference){nav.tabs a.on .nav-icon svg{animation:iconPop .45s ease both}}
main{padding-bottom:96px}
header{padding:26px 16px 70px}
.hrow{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);border:1px solid rgba(61,242,168,.3);border-radius:999px;padding:3px 12px;margin-bottom:12px}
h1{font:500 clamp(34px,6vw,56px)/1.05 "Space Grotesk",sans-serif;letter-spacing:-.03em;margin:0 0 8px}

<script>
// Opening animation: runs once per page open, tap to skip
(function(){
  const sp=document.getElementById("splash");if(!sp)return;
  let gone=false;
  const close=()=>{if(gone)return;gone=true;sp.classList.add("out");setTimeout(()=>sp.remove(),1000)};
  sp.addEventListener("click",close);
  setTimeout(close,3900);
})();

const SHEET_ID="18KJibHGn8-kxp_YsTu_9wbhTXNwTcvSeWQnWlEOhvgg";
const url=t=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(t)}`;
const $=id=>document.getElementById(id);
const inr=n=>(n<0?"-":"")+"₹"+Math.round(Math.abs(n)).toLocaleString("en-IN");
const num=v=>parseFloat(String(v??"").replace(/,/g,""))||0;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmtDay=d=>new Date(d+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const group=(a,k,v)=>{const m={};a.forEach(x=>{const key=k(x);if(key)m[key]=(m[key]||0)+v(x)});return m};
const PAL=["#A78BFA","#4DD8E8","#FFC979","#FF789A","#7C9BFF","#4DE2C5","#B4A6FF"];

function fixDate(s){ // mixed date styles in the sheet -> YYYY-MM-DD (2026)
  if(!s)return null;
  let [a,b]=String(s).trim().split(/[-\/]/).map(x=>parseInt(x,10));
  if(!a||!b)return null;
  let day=a,month=b;
  if(a===5){day=b;month=5}
  if(month>12||day>31)return null;
  return `2026-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
}
const codeOf=s=>{const m=String(s).match(/\(?\s*(kh[a-z]\d+)\s*\)/i);return m?m[1].toLowerCase():""};
const cleanName=s=>String(s).replace(/\(.*?\)/g,"").trim();
function category(n){
  if(/slit|churidar/.test(n))return"Slit churidar";
  if(/anarkal|anarrkal/.test(n))return"Anarkali";
  if(/salwar|ferarow/.test(n))return"Salwar";
  if(/code ?set|codeset/.test(n))return"Code set";
  if(/gown|kafthan|romber/.test(n))return"Gown / Kaftan / Romper";
  if(/top|shirt|skirt|kurthi|pintrest/.test(n))return"Tops and skirts";
  return"Other";
}
function etype(raw){
  const m=String(raw).match(/^(.*?)\s*\((.*)\)/);
  if(m&&/^other/i.test(m[1]))return"Other: "+m[2];
  return(m?m[1]:String(raw)).trim()||"Other";
}
async function load(tab){
  const r=await fetch(url(tab));
  if(!r.ok)throw new Error(tab);
  return Papa.parse(await r.text(),{header:true,skipEmptyLines:true,transformHeader:h=>h.trim().toLowerCase()}).data;
}
async function loadCap(){ // the CAPITAL tab name may have a trailing space
  for(const n of["CAPITAL ","CAPITAL"]){try{const r=await load(n);if(r.length&&"partner name" in r[0])return r}catch(e){}}
  return[];
}

let SALES=[],EXPS=[],PUR=[],CAP=[],BUY={},charts={},cur="overview";

async function boot(){
  $("status").textContent="Loading your sheet…";
  try{
    const [sale,purchase,expense,cap]=await Promise.all([load("SALE"),load("PURCHASE"),load("EXPENCE"),loadCap()]);
    SALES=sale.map(r=>{
      const name=(r["product name"]||"").trim().toLowerCase();
      return{date:fixDate(r["date"]),name,code:codeOf(name),label:cleanName(name),cost:num(r["wholsale price"]),qty:num(r["quantity"])||1,rev:num(r["retail price"]),out:/out of stock/i.test(Object.values(r).join(" "))};
    }).filter(r=>r.name&&r.date);
    SALES.forEach(r=>{r.profit=r.rev-r.cost;r.cat=category(r.label)});
    EXPS=expense.map(r=>({date:fixDate(r["date"]),raw:r["expence type"]||"",type:etype(r["expence type"]||""),amt:num(r["amount"])})).filter(r=>r.amt);
    PUR=purchase.map(r=>{
      const q=num(r["quantity"]),code=codeOf(r["product code"]||""),p=num(r["wholsale price per ps"]);
      let v=String(r["venter"]||"").trim().toUpperCase();if(v==="MUMAI")v="MUMBAI";
      return{date:(r["date"]||"").trim(),vendor:v,name:cleanName(r["product name"]||""),code,qty:q,total:num(r["total price"])||(code?q*p:p)};
    }).filter(r=>r.name);
    CAP=cap.map(r=>({n:r["partner name"],cap:num(r["capital amount"]),inv:num(r["invest amount"])})).filter(r=>r.n);
    BUY={};
    PUR.filter(r=>r.code).forEach(r=>{const b=BUY[r.code]=BUY[r.code]||{qty:0,total:0,name:r.name};b.qty+=r.qty;b.total+=r.total});
    const ds=SALES.map(r=>r.date).sort();
    $("from").min=$("to").min=ds[0];$("from").max=$("to").max=ds[ds.length-1];
    $("status").textContent=`Synced ${new Date().toLocaleTimeString("en-IN")} · ${SALES.length} sales rows`;
    render();
  }catch(e){
    console.error(e);
    $("status").textContent="Could not load the sheet";
    $("page").innerHTML=`<div class="card err"><b>We could not read your Google Sheet.</b><br>Open the sheet, click Share, and set General access to "Anyone with the link: Viewer". Keep the tab names SALE, PURCHASE, CAPITAL and EXPENCE. Then tap Refresh.</div>`;
  }
}

function range(){
  const all=SALES.map(r=>r.date).sort(),max=all[all.length-1],min=all[0];
  let from=$("from").value||min,to=$("to").value||max;
  const on=document.querySelector("#filters button.on");
  if(on&&+on.dataset.d&&!$("from").value){
    const d=new Date(max+"T00:00");d.setDate(d.getDate()-(+on.dataset.d-1));
    from=d.toISOString().slice(0,10);
  }
  return[from,to];
}

// ---------- chart helpers ----------
function mk(id,cfg){
  if(charts[id])charts[id].destroy();
  Chart.defaults.color=css("--muted");Chart.defaults.font.family="Space Grotesk, system-ui, sans-serif";
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false},cfg.options||{});
  charts[id]=new Chart(id,cfg);
}
const gl=()=>({color:css("--line")});
const k=v=>"₹"+v/1000+"k";
function dn(id,o){mk(id,{type:"doughnut",data:{labels:Object.keys(o),datasets:[{data:Object.values(o),backgroundColor:PAL,borderWidth:0}]},options:{cutout:"58%",plugins:{legend:{position:"bottom"},tooltip:{callbacks:{label:c=>`${c.label}: ${inr(c.raw)}`}}}}})}
function hb(id,labels,data,color,f){mk(id,{type:"bar",data:{labels,datasets:[{data,backgroundColor:color,borderRadius:4}]},options:{indexAxis:"y",plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>(f||inr)(c.raw)}}},scales:{x:{grid:gl()},y:{grid:{display:false}}}}})}
function vb(id,labels,data,color,f){mk(id,{type:"bar",data:{labels,datasets:[{data,backgroundColor:color,borderRadius:4}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>(f||inr)(c.raw)}}},scales:{y:{grid:gl(),ticks:{callback:k}},x:{grid:{display:false}}}}})}
function daily(id,d){
  mk(id,{data:{labels:d.days.map(fmtDay),datasets:[
    {type:"line",label:"Profit",data:d.days.map(x=>d.dayProfit[x]),borderColor:"#f5b84a",backgroundColor:"#f5b84a",tension:.3,pointRadius:2,order:1},
    {type:"bar",label:"Sales",data:d.days.map(x=>d.daySales[x]),backgroundColor:"#1f9d6b",borderRadius:4,order:2}]},
    options:{scales:{y:{grid:gl(),ticks:{callback:k}},x:{grid:{display:false}}},plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${inr(c.raw)}`}}}}});
}

// ---------- html helpers ----------
const K=(l,v,n,c,m)=>`<div class="card kpi ${m?"main":""}" style="--c:${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
const C=(t,h,b,x="")=>`<div class="card ${x}"><h2>${t}</h2><p class="hint">${h}</p>${b}</div>`;
const CH=id=>`<div class="ch"><canvas id="${id}"></canvas></div>`;
const T=(h,rows)=>`<div class="scroll"><table><tr>${h.map(x=>`<th class="${x[1]?"num":""}">${x[0]}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${h[i][1]?"num":""}">${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const tag=(t,c)=>`<span class="tag ${c}">${t}</span>`;

// ---------- shared numbers ----------
function stockRows(){
  const sold=group(SALES,r=>r.code,r=>r.qty);
  return Object.keys(BUY).map(c=>({c,name:BUY[c].name,bought:BUY[c].qty,sold:sold[c]||0,left:BUY[c].qty-(sold[c]||0),unit:BUY[c].total/BUY[c].qty})).sort((a,b)=>a.left-b.left);
}
function D(){
  const [from,to]=range();
  const s=SALES.filter(r=>r.date>=from&&r.date<=to),e=EXPS.filter(r=>!r.date||(r.date>=from&&r.date<=to));
  const rev=sum(s,r=>r.rev),cost=sum(s,r=>r.cost),pcs=sum(s,r=>r.qty),exp=sum(e,r=>r.amt),gross=rev-cost;
  const by={};
  s.forEach(r=>{const x=r.code||r.label;const o=by[x]=by[x]||{label:r.label,code:r.code,qty:0,rev:0,profit:0};o.qty+=r.qty;o.rev+=r.rev;o.profit+=r.profit});
  return{s,e,rev,cost,pcs,exp,gross,net:gross-exp,margin:rev?gross/rev*100:0,
    days:[...new Set(s.map(r=>r.date))].sort(),daySales:group(s,r=>r.date,r=>r.rev),dayProfit:group(s,r=>r.date,r=>r.profit),
    prods:Object.values(by).sort((a,b)=>b.profit-a.profit),expBy:group(e,r=>r.type,r=>r.amt),cat:group(s,r=>r.cat,r=>r.rev)};
}
const prodTable=d=>T([["Product"],["Pieces",1],["Sales",1],["Profit",1],["Margin",1]],d.prods.map(p=>[p.label+(p.code?` <span class="code">${p.code.toUpperCase()}</span>`:""),p.qty,inr(p.rev),`<b>${inr(p.profit)}</b>`,(p.rev?p.profit/p.rev*100:0).toFixed(0)+"%"]));
const topChart=(id,d)=>{const t=d.prods.slice(0,8);hb(id,t.map(p=>p.label.slice(0,24)),t.map(p=>p.profit),"#3df2a8")};

// ---------- pages ----------
function pOverview(d){
  const st=stockRows(),stockVal=sum(st.filter(x=>x.left>0),x=>x.left*x.unit);
  const totCap=sum(CAP,x=>x.cap),totBuy=sum(PUR,x=>x.total),allRev=sum(SALES,r=>r.rev),allExp=sum(EXPS,r=>r.amt);
  const tips=[],best=[...d.prods].sort((a,b)=>b.qty-a.qty)[0],bd=Object.entries(d.dayProfit).sort((a,b)=>b[1]-a[1])[0];
  tips.push(["good","🏆",`<b>Best seller:</b> ${best.label} sold ${best.qty} pieces. Keep it in stock and show it first in your posts.`]);
  tips.push(["good","📅",`<b>Best day:</b> ${fmtDay(bd[0])} made ${inr(bd[1])} profit. Repeat whatever you posted or offered that day.`]);
  const low=st.filter(x=>x.left>=0&&x.left<=3&&x.sold>0);
  if(low.length)tips.push(["warn","⚠️",`<b>Restock soon:</b> ${low.slice(0,4).map(x=>`${x.name} (${x.c.toUpperCase()}) ${x.left} left`).join(", ")}.`]);
  const slow=st.filter(x=>x.left>=8&&x.sold/x.bought<0.3);
  if(slow.length)tips.push(["warn","🐢",`<b>Slow movers:</b> ${slow.slice(0,3).map(x=>`${x.name} (${x.c.toUpperCase()}): ${x.left} unsold`).join(", ")}. Try a discount and avoid buying more.`]);
  const te=Object.entries(d.expBy).sort((a,b)=>b[1]-a[1])[0];
  if(te)tips.push([te[1]>d.gross*.25?"bad":"","💸",`<b>Biggest expense:</b> ${te[0]} at ${inr(te[1])}, ${(te[1]/d.gross*100).toFixed(0)}% of your dress profit.`]);
  const lm=d.prods.filter(p=>p.qty>=5&&p.rev&&p.profit/p.rev<.2);
  if(lm.length)tips.push(["bad","📉",`<b>Low margin:</b> ${lm.slice(0,3).map(p=>p.label).join(", ")} earns under 20% profit. Check the price.`]);
  const bad=SALES.filter(r=>r.profit<=0||r.out).length;
  if(bad)tips.push(["","🔎",`<b>Data check:</b> ${bad} sale rows look odd (zero or negative profit, or out of stock). Review them in your sheet.`]);
  $("page").innerHTML=`<div class="kpis">`+
    K("Take-home profit",inr(d.net),"After all expenses","#f5b84a",1)+K("Total sales",inr(d.rev),`${d.days.length} selling days`,"#2fd48f")+
    K("Profit on dresses",inr(d.gross),`${d.margin.toFixed(0)}% margin`,"#3df2a8")+K("Pieces sold",d.pcs,`${inr(d.rev/d.pcs)} average`,"#46c2ff")+
    K("Expenses",inr(d.exp),`${d.rev?(d.exp/d.rev*100).toFixed(0):0}% of sales`,"#ff6b8a")+`</div>`+
    C("What to do next","Simple advice from your numbers.",`<div class="tips">${tips.map(t=>`<div class="tip ${t[0]}"><i>${t[1]}</i><div>${t[2]}</div></div>`).join("")}</div>`)+
    `<div class="grid">`+C("Sales and profit each day","Bars show sales. The line shows profit.",CH("c1"),"wide")+
    C("Top 8 products by profit","These make you the most money.",CH("c2"))+C("Sales by product type","Which kind of dress sells most.",CH("c3"))+`</div>`+
    C("Business position (all time)","Does not change with the date filter. Money in hand is an estimate.",`<div class="kpis" style="margin:0">`+
    K("Partner capital",inr(totCap),"Money put in","#2fd48f")+K("Total purchases",inr(totBuy),"Stock bought","#46c2ff")+
    K("Stock on shelf",inr(stockVal),"At buying price","#f5b84a")+K("Money in hand",inr(totCap+allRev-totBuy-allExp),"Capital + sales − purchases − expenses","#3df2a8")+`</div>`);
  daily("c1",d);topChart("c2",d);dn("c3",d.cat);
}

function pSales(d){
  const wd=[0,0,0,0,0,0,0];d.s.forEach(r=>wd[new Date(r.date+"T00:00").getDay()]+=r.rev);
  const recent=[...d.s].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25);
  $("page").innerHTML=`<div class="kpis">`+K("Total sales",inr(d.rev),`${d.days.length} selling days`,"#2fd48f",1)+K("Profit on dresses",inr(d.gross),`${d.margin.toFixed(0)}% margin`,"#3df2a8")+
    K("Pieces sold",d.pcs,"In this period","#46c2ff")+K("Average price",inr(d.rev/d.pcs),"Per piece","#f5b84a")+K("Profit per piece",inr(d.gross/d.pcs),"Before expenses","#9b8cff")+`</div>`+
    `<div class="grid">`+C("Sales and profit each day","Bars show sales. The line shows profit.",CH("c1"),"wide")+
    C("Top 8 products by profit","Best earners.",CH("c2"))+C("Sales by product type","Share of sales.",CH("c3"))+
    C("Best days of the week","Gold bar is the best day.",CH("c4"))+C("Pieces by product","Most sold first.",CH("c5"))+`</div>`+
    C("All products","Sorted by profit.",prodTable(d))+
    C("Latest 25 sales","Most recent first.",T([["Date"],["Product"],["Qty",1],["Price",1],["Profit",1]],recent.map(r=>[fmtDay(r.date),r.label,r.qty,inr(r.rev),inr(r.profit)])),"gap");
  daily("c1",d);topChart("c2",d);dn("c3",d.cat);
  const mx=Math.max(...wd);
  mk("c4",{type:"bar",data:{labels:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],datasets:[{data:wd,backgroundColor:wd.map(v=>v===mx?"#f5b84a":"#1f9d6b"),borderRadius:4}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>inr(c.raw)}}},scales:{y:{grid:gl(),ticks:{callback:k}},x:{grid:{display:false}}}}});
  const q=[...d.prods].sort((a,b)=>b.qty-a.qty).slice(0,8);hb("c5",q.map(p=>p.label.slice(0,24)),q.map(p=>p.qty),"#46c2ff",n=>n+" pcs");
}

function pPurchase(){
  const st=stockRows(),tot=sum(PUR,r=>r.total),pcs=sum(PUR,r=>r.qty),val=sum(st.filter(x=>x.left>0),x=>x.left*x.unit);
  const byV=group(PUR,r=>r.vendor,r=>r.total),pv=group(PUR,r=>r.vendor,r=>r.qty);
  const stt=r=>r.left<0?tag("Check sheet","t-chk"):r.left===0?tag("Sold out","t-out"):r.left<=3?tag("Low","t-low"):tag("In stock","t-ok");
  const bp=Object.entries(group(PUR.filter(r=>r.code),r=>r.name,r=>r.qty)).sort((a,b)=>b[1]-a[1]).slice(0,8);
  $("page").innerHTML=`<div class="kpis">`+K("Total purchases",inr(tot),"All suppliers","#46c2ff",1)+K("Pieces bought",pcs,"All suppliers","#2fd48f")+
    K("Stock on shelf",inr(val),"At buying price","#f5b84a")+K("Suppliers",Object.keys(byV).length,"Mumbai, Calicut, Palakkad…","#3df2a8")+`</div>`+
    `<div class="grid">`+C("Spend by supplier","Where your buying money went.",CH("c1"))+C("Most bought products","Pieces bought, coded products only.",CH("c2"))+`</div>`+
    C("Suppliers","Total spend and pieces.",T([["Supplier"],["Pieces",1],["Spend",1]],Object.keys(byV).sort((a,b)=>byV[b]-byV[a]).map(v=>[v,pv[v],inr(byV[v])])))+
    C("Stock check","Bought minus sold for every product code. Least stock first.",T([["Product"],["Bought",1],["Sold",1],["Left",1],["Sold so far"],["Status"]],st.map(r=>[`${r.name} <span class="code">${r.c.toUpperCase()}</span>`,r.bought,r.sold,`<b>${r.left}</b>`,`<div class="bar"><b style="width:${r.bought?Math.min(100,r.sold/r.bought*100):0}%"></b></div>`,stt(r)])),"gap")+
    C("All purchases","Dates are shown as typed in your sheet.",T([["Date"],["Supplier"],["Product"],["Qty",1],["Total",1]],PUR.map(r=>[r.date,r.vendor,r.name+(r.code?` <span class="code">${r.code.toUpperCase()}</span>`:""),r.qty,inr(r.total)])),"gap");
  dn("c1",byV);hb("c2",bp.map(x=>x[0].slice(0,24)),bp.map(x=>x[1]),"#2fd48f",n=>n+" pcs");
}

function pCapital(d){
  const totCap=sum(CAP,x=>x.cap);
  if(!CAP.length){$("page").innerHTML=`<div class="card err">No partner data found. Check that your CAPITAL tab has the columns PARTNER NAME, CAPITAL AMOUNT and INVEST AMOUNT.</div>`;return}
  const net=sum(SALES,r=>r.profit)-sum(EXPS,r=>r.amt),totBuy=sum(PUR,r=>r.total),st=stockRows(),val=sum(st.filter(x=>x.left>0),x=>x.left*x.unit);
  const cash=totCap+sum(SALES,r=>r.rev)-totBuy-sum(EXPS,r=>r.amt);
  const rows=CAP.map(p=>{const sh=totCap?p.cap/totCap:0;return{...p,sh,pr:net*sh}});
  $("page").innerHTML=`<div class="kpis">`+K("Total capital",inr(totCap),`${CAP.length} partners`,"#2fd48f",1)+K("Net profit so far",inr(net),"All time, after expenses","#3df2a8")+
    K("Stock on shelf",inr(val),"At buying price","#f5b84a")+K("Money in hand",inr(cash),"Estimate","#46c2ff")+`</div>`+
    `<div class="grid">`+C("Capital share","Each partner's part of the capital.",CH("c1"))+C("Capital and profit share","Money put in and profit earned by each partner.",CH("c2"))+`</div>`+
    C("Partner share sheet","Profit is split by capital share.",T([["Partner"],["Capital",1],["Invested",1],["Share",1],["Profit share",1],["Total value",1]],rows.map(r=>[`<b>${r.n}</b>`,inr(r.cap),inr(r.inv),(r.sh*100).toFixed(1)+"%",inr(r.pr),`<b>${inr(r.inv+r.pr)}</b>`])))+
    C("Where the capital is now","Your money is in stock, in cash, and in costs already spent.",T([["Item"],["Amount",1]],[["Capital put in",inr(totCap)],["Stock on shelf (buying price)",inr(val)],["Estimated money in hand",inr(cash)],["Expenses paid",inr(sum(EXPS,r=>r.amt))]]),"gap");
  dn("c1",Object.fromEntries(rows.map(r=>[r.n,r.cap])));
  mk("c2",{type:"bar",data:{labels:rows.map(r=>r.n),datasets:[{label:"Invested",data:rows.map(r=>r.inv),backgroundColor:"#1f9d6b",borderRadius:4},{label:"Profit share",data:rows.map(r=>r.pr),backgroundColor:"#f5b84a",borderRadius:4}]},options:{scales:{y:{grid:gl(),ticks:{callback:k}},x:{grid:{display:false}}},plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${inr(c.raw)}`}}}}});
}

function pExpense(d){
  const sumT=re=>sum(d.e.filter(r=>re.test(r.type)),r=>r.amt);
  const dayE=group(d.e.filter(r=>r.date),r=>r.date,r=>r.amt),dd=Object.keys(dayE).sort();
  const rows=[...d.e].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  $("page").innerHTML=`<div class="kpis">`+K("Total expenses",inr(d.exp),`${d.rev?(d.exp/d.rev*100).toFixed(0):0}% of sales`,"#ff6b8a",1)+
    K("Delivery and post",inr(sumT(/dtdc|post|parcel/i)),"DTDC, post, parcel","#46c2ff")+K("Models",inr(sumT(/model/i)),"Model charges","#2fd48f")+
    K("Ads and other",inr(sumT(/^other/i)),"Fuel, ads, packing, giveaway","#f5b84a")+`</div>`+
    `<div class="grid">`+C("Where the money goes","Each type of expense.",CH("c1"))+C("Expenses each day","Tall bars are heavy spending days.",CH("c2"))+`</div>`+
    C("All expenses","Most recent first.",T([["Date"],["Type"],["Amount",1]],rows.map(r=>[r.date?fmtDay(r.date):"",r.raw,inr(r.amt)])));
  dn("c1",d.expBy);vb("c2",dd.map(fmtDay),dd.map(x=>dayE[x]),"#ff6b8a");
}


function pReports(d){
  const monthly={};
  d.s.forEach(r=>{
    const key=r.date.slice(0,7);
    const m=monthly[key]||(monthly[key]={sales:0,profit:0,qty:0,rows:0});
    m.sales+=r.rev;m.profit+=r.profit;m.qty+=r.qty;m.rows++;
  });
  const months=Object.keys(monthly).sort();
  const monthLabels=months.map(m=>new Date(m+"-01T00:00").toLocaleDateString("en-IN",{month:"short",year:"2-digit"}));
  const monthSales=months.map(m=>monthly[m].sales);
  const monthProfit=months.map(m=>monthly[m].profit);
  const expenseEntries=Object.entries(d.expBy).sort((a,b)=>b[1]-a[1]);
  const products=[...d.prods].sort((a,b)=>b.profit-a.profit);
  const stock=stockRows();
  const lowStock=stock.filter(x=>x.left>=0&&x.left<=3&&x.sold>0);
  const excessStock=stock.filter(x=>x.left>=8&&x.bought>0&&x.sold/x.bought<.3);
  const top=products[0];
  const lowMargin=products.filter(x=>x.qty>=3&&x.rev>0&&x.profit/x.rev<.2);
  const expenseRatio=d.rev?d.exp/d.rev*100:0;
  const grossMargin=d.rev?d.gross/d.rev*100:0;
  const netMargin=d.rev?d.net/d.rev*100:0;
  const averageSale=d.s.length?d.rev/d.s.length:0;
  const bestMonth=months.length?months.reduce((a,b)=>monthly[a].profit>monthly[b].profit?a:b):null;
  const observations=[];
  if(top) observations.push(["🏅",`Top profit product: ${top.label}`,`${inr(top.profit)} profit from ${top.qty} pieces sold. Consider featuring it and protecting its stock.`]);
  if(bestMonth) observations.push(["📈",`Strongest month: ${monthLabels[months.indexOf(bestMonth)]}`,`${inr(monthly[bestMonth].profit)} dress profit before expenses. Compare promotions and product mix from this month.`]);
  if(expenseRatio>25) observations.push(["💸","Expense pressure is high",`Expenses are ${expenseRatio.toFixed(1)}% of sales. Review recurring costs and compare each expense category before increasing spend.`]);
  else observations.push(["✅","Expense ratio is controlled",`Expenses are ${expenseRatio.toFixed(1)}% of sales in this selected period. Keep monitoring the largest categories.`]);
  if(lowStock.length) observations.push(["📦","Restock watch",`${lowStock.length} products have 1–3 pieces left based on purchases minus recorded sales. Verify physical stock before reordering.`]);
  if(excessStock.length) observations.push(["🐢","Slow-moving inventory",`${excessStock.length} products have at least 8 pieces left and less than 30% sold against recorded purchases. Consider bundles or targeted offers.`]);
  if(lowMargin.length) observations.push(["⚖️","Low-margin products",`${lowMargin.length} products with at least 3 pieces sold have under 20% gross margin. Recheck wholesale cost, retail price and discounting.`]);
  const expRows=expenseEntries.map(([name,value])=>[name,inr(value),d.exp?(value/d.exp*100).toFixed(1)+"%":"0%",`<div class="progress-track"><span style="width:${d.exp?value/d.exp*100:0}%"></span></div>`]);
  const productRows=products.slice(0,12).map(x=>[x.label,x.qty,inr(x.rev),inr(x.profit),x.rev?(x.profit/x.rev*100).toFixed(1)+"%":"—"]);
  const monthlyRows=months.map((m,i)=>[monthLabels[i],inr(monthly[m].sales),inr(monthly[m].profit),monthly[m].qty,monthly[m].rows]);
  $("page").innerHTML=
    `<div class="kpis">`+
    K("Net operating result",inr(d.net),"Dress profit less recorded expenses","#f5b84a",1)+
    K("Gross margin",grossMargin.toFixed(1)+"%","Before operating expenses","#3df2a8")+
    K("Net margin",netMargin.toFixed(1)+"%","After recorded expenses","#9b8cff")+
    K("Average sale row",inr(averageSale),"Sales value divided by rows","#46c2ff")+
    K("Expense ratio",expenseRatio.toFixed(1)+"%","Expenses as a share of sales","#ff6b8a")+
    `</div>`+
    `<div class="report-grid">`+
    C("Monthly sales vs profit","Track whether sales growth is translating into profit.",CH("r1"),"wide")+
    C("Expense mix","Understand which categories consume the most money.",CH("r2"))+
    C("Profit by product","Compare product contribution, not only sales volume.",CH("r3"))+
    `</div>`+
    C("Management insights","Action points generated from the selected date range.",`<div class="insight-list">${observations.map(x=>`<div class="insight-row"><span class="insight-icon">${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join("")}</div>`) +
    `<div class="report-grid">`+
    C("Monthly performance","Sales, dress profit, pieces and number of sale rows.",T([["Month"],["Sales",1],["Dress profit",1],["Pieces",1],["Sale rows",1]],monthlyRows),"wide")+
    C("Expense analysis","Share of total expenses by category.",T([["Expense type"],["Amount",1],["Share",1],["Weight"]],expRows))+
    C("Product profitability","Top products ranked by gross profit before expenses.",T([["Product"],["Pieces",1],["Sales",1],["Profit",1],["Margin",1]],productRows))+
    `</div>`+
    C("Inventory health","Purchase quantity less recorded sales quantity; validate against physical stock.",T([["Product"],["Bought",1],["Sold",1],["Remaining",1],["Status"]],stock.map(x=>[x.name+(x.c?` <span class="code">${x.c.toUpperCase()}</span>`:""),x.bought,x.sold,`<b>${x.left}</b>`,x.left<0?tag("Check data","t-chk"):x.left===0?tag("Sold out","t-out"):x.left<=3?tag("Low stock","t-low"):tag("Available","t-ok")])),"gap")+
    `<div class="report-note gap"><b>How to read these reports:</b> Gross profit is retail sales minus the wholesale cost recorded on each sale row. Net operating result subtracts recorded expenses. Inventory is estimated from purchase quantities minus matched product-code sales. It does not include unrecorded returns, damaged stock, transfers, taxes, owner withdrawals or payment timing.</div>`;
  if(months.length){
    mk("r1",{data:{labels:monthLabels,datasets:[
      {type:"bar",label:"Sales",data:monthSales,backgroundColor:"#46c2ff",borderRadius:6,order:2},
      {type:"line",label:"Dress profit",data:monthProfit,borderColor:"#f5b84a",backgroundColor:"#f5b84a",tension:.35,pointRadius:3,borderWidth:3,order:1}
    ]},options:{scales:{y:{grid:gl(),ticks:{callback:k}},x:{grid:{display:false}}},plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${inr(c.raw)}`}}}}});
  }
  dn("r2",d.expBy);
  const pp=products.slice(0,8);
  hb("r3",pp.map(x=>x.label.slice(0,22)),pp.map(x=>x.profit),"#9b8cff");
}

// User interface preferences: remember layout and color theme on this device.
function applyLayout(mode){
  document.body.classList.toggle("layout-mobile",mode==="mobile");
  document.body.classList.toggle("layout-desktop",mode==="desktop");
  $("mobileMode").classList.toggle("active",mode==="mobile");
  $("desktopMode").classList.toggle("active",mode==="desktop");
  $("mobileMode").setAttribute("aria-pressed",String(mode==="mobile"));
  $("desktopMode").setAttribute("aria-pressed",String(mode==="desktop"));
  try{localStorage.setItem("khayla-layout-mode",mode)}catch(e){}
}
function applyTheme(theme){
  const light=theme==="light";
  document.body.classList.toggle("light-mode",light);
  $("themeIcon").textContent=light?"☾":"☀";
  $("themeLabel").textContent=light?"Dark mode":"Light mode";
  $("themeToggle").setAttribute("aria-label",light?"Switch to dark mode":"Switch to light mode");
  try{localStorage.setItem("khayla-theme",theme)}catch(e){}
  if(typeof Chart!=="undefined"){Chart.defaults.color=css("--muted");Object.values(charts).forEach(c=>{c.options.scales&&Object.values(c.options.scales).forEach(sc=>{if(sc.grid)sc.grid.color=css("--line")});c.update("none")})}
}
let savedLayout="mobile",savedTheme="dark";
try{savedLayout=localStorage.getItem("khayla-layout-mode")||savedLayout;savedTheme=localStorage.getItem("khayla-theme")||savedTheme}catch(e){}
applyLayout(savedLayout==="desktop"?"desktop":"mobile");
applyTheme(savedTheme==="light"?"light":"dark");
$("mobileMode").addEventListener("click",()=>applyLayout("mobile"));
$("desktopMode").addEventListener("click",()=>applyLayout("desktop"));
$("themeToggle").addEventListener("click",()=>applyTheme(document.body.classList.contains("light-mode")?"dark":"light"));

function render(){
  cur=PAGES[location.hash.slice(1)]?location.hash.slice(1):"overview";
  document.querySelectorAll("[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p===cur));
  $("title").textContent=PAGES[cur].t;
  $("pageEyebrow").textContent="KHAYLA  /  "+PAGES[cur].eyebrow;
  $("pageLead").textContent=PAGES[cur].lead;
  $("pageMark").innerHTML=ICONS[cur];
  document.body.dataset.page=cur;
  $("filters").classList.toggle("off",!PAGES[cur].filter);
  if(!SALES.length)return;
  Object.values(charts).forEach(c=>c.destroy());charts={};
  const d=D();
  if(!d.s.length){$("page").innerHTML=`<div class="card err">No sales in these dates. Try "All time".</div>`;return}
  PAGES[cur].f(d);
  scrollTo(0,0);
}
window.addEventListener("hashchange",render);
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");$("from").value="";$("to").value="";render();
});
["from","to"].forEach(i=>$(i).onchange=()=>{document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));render()});
$("refresh").onclick=boot;
render();boot();
